services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: flavorbase-db
    environment:
      POSTGRES_DB: flavorbase
      POSTGRES_USER: flavorbase_admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flavorbase_admin -d flavorbase"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flavorbase-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://db:5432/flavorbase
      DATABASE_USERNAME: flavorbase_app
      DATABASE_PASSWORD: app_password
      JWT_SECRET: your-very-secure-secret-key-that-should-be-at-least-256-bits-long-for-docker-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://nginx
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy & SPA Server
  nginx:
    image: nginx:1.25-alpine
    container_name: flavorbase-nginx
    ports:
      - "3000:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (for future caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: flavorbase-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: flavorbase-network
