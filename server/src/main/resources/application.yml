spring:
  application:
    name: flavorbase-server
  
  profiles:
    active: dev
  
  datasource:
    url: jdbc:h2:mem:flavorbase
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.flavorbase: DEBUG
    org.springframework.security: DEBUG

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-very-secure-secret-key-that-should-be-at-least-256-bits-long}
  expiration: 3600000 # 1 hour in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

---
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flavorbase}
    username: ${DATABASE_USERNAME:flavorbase}
    password: ${DATABASE_PASSWORD:password}
    driverClassName: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.flavorbase: INFO
    org.springframework.security: WARN
