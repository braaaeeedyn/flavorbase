spring:
  config:
    activate:
      on-profile: postgresql
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flavorbase}
    username: ${DATABASE_USERNAME:flavorbase_app}
    password: ${DATABASE_PASSWORD:app_password}
    driverClassName: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none  # Let Flyway handle schema management
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          
  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    sql-migration-suffixes: .sql

# Disable H2 console
  h2:
    console:
      enabled: false

logging:
  level:
    com.flavorbase: DEBUG
    org.springframework.web: DEBUG
