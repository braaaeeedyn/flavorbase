spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://database:5432/flavorbase}
    username: ${DATABASE_USERNAME:flavorbase}
    password: ${DATABASE_PASSWORD:password}
    driverClassName: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # Redis configuration (for future use)
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

logging:
  level:
    com.flavorbase: INFO
    org.springframework.security: WARN

# CORS for Docker environment
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://frontend}
